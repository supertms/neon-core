name: Deploy Neon Core preview

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true
      - name: Validate source scripts and assets
        run: |
          node --check assets/pixel-genesis.js
          node --check assets/panel-raster.js
          node -e 'const fs=require("fs");const html=fs.readFileSync("index.html","utf8");new Function(html.split("<script>").pop().split("</script>")[0]);["assets/pixel-genesis.css","assets/pixel-genesis.js","assets/panel-raster.css","assets/panel-raster.js"].forEach(p=>{if(!fs.existsSync(p))throw Error("Missing "+p)});if(!html.includes("id=\"fxmode\""))throw Error("Missing FX switch");if(!html.includes("layer.appendChild(p);\n  const pixelArrival"))throw Error("Panel rasterization requires mounted DOM");console.log("Neon Core raster source checks passed")'
      - name: Prepare static site
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp -R assets _site/assets
          touch _site/.nojekyll
      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
